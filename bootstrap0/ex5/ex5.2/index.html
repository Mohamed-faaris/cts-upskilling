<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 5.2 - Reorder Columns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Exercise 5.2 - Reorder Columns</h1>
    <p class="text-center">On mobile: 1, 2, 3. On desktop: 3, 1, 2</p>
    <div class="row">
      <div class="col-12 col-md-4 order-md-2">
        <div class="bg-danger text-white p-4 text-center rounded mb-3">Column 1 (becomes 3rd on md)</div>
      </div>
      <div class="col-12 col-md-4 order-md-3">
        <div class="bg-warning text-white p-4 text-center rounded mb-3">Column 2 (becomes 1st on md)</div>
      </div>
      <div class="col-12 col-md-4 order-md-1">
        <div class="bg-success text-white p-4 text-center rounded mb-3">Column 3 (becomes 2nd on md)</div>
      </div>
    </div>
  </div>
</body>
</html>
