<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 12.2 - Pricing Section</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-5">Exercise 12.2 - Pricing Section</h1>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card text-center p-4 shadow-sm">
          <h4 class="text-muted mb-3">Free</h4>
          <h2 class="display-5 fw-bold mb-3">$0</h2>
          <ul class="list-unstyled mb-4">
            <li class="py-2">10 users</li>
            <li class="py-2">2GB storage</li>
            <li class="py-2">Email support</li>
          </ul>
          <button class="btn btn-outline-primary w-100 py-2">Sign Up Free</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center p-4 shadow border-primary">
          <h4 class="text-primary mb-3">Pro</h4>
          <h2 class="display-5 fw-bold mb-3">$29</h2>
          <ul class="list-unstyled mb-4">
            <li class="py-2">Unlimited users</li>
            <li class="py-2">50GB storage</li>
            <li class="py-2">Priority support</li>
          </ul>
          <button class="btn btn-primary w-100 py-2">Get Started</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-center p-4 shadow-sm">
          <h4 class="text-muted mb-3">Enterprise</h4>
          <h2 class="display-5 fw-bold mb-3">$99</h2>
          <ul class="list-unstyled mb-4">
            <li class="py-2">Unlimited everything</li>
            <li class="py-2">1TB storage</li>
            <li class="py-2">24/7 support</li>
          </ul>
          <button class="btn btn-outline-primary w-100 py-2">Contact Us</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
