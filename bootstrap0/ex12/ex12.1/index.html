<body>
  <div class="container mt-5">
    <h1 class="mb-4">Exercise 12.1 - Margin & Padding Utilities</h1>

    <div class="bg-secondary text-white py-5 mt-4">Large vertical padding (py-5) with top margin (mt-4)</div>
