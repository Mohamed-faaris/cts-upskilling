<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 6.2 - Flex Card Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Exercise 6.2 - Flex Card Layout</h1>
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div class="card" style="width: 18rem;">
        <div class="card-body text-center">
          <h5 class="card-title">Basic Plan</h5>
          <p class="card-text">$10/month</p>
          <button class="btn btn-primary">Choose</button>
        </div>
      </div>
      <div class="card border-primary" style="width: 18rem;">
        <div class="card-body text-center">
          <h5 class="card-title">Pro Plan</h5>
          <p class="card-text">$25/month</p>
          <button class="btn btn-success">Choose</button>
        </div>
      </div>
      <div class="card" style="width: 18rem;">
        <div class="card-body text-center">
          <h5 class="card-title">Enterprise</h5>
          <p class="card-text">$50/month</p>
          <button class="btn btn-warning">Choose</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
