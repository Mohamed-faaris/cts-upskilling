<!DOCTYPE html>
<html lang="en">
<head>

<body>
  <div class="container-fluid">
    <div class="row">
      <div class="d-none d-md-block col-md-3 col-lg-2 bg-dark text-white vh-100 p-3">

        <ul class="nav flex-column">
          <li class="nav-item"><a href="#" class="nav-link text-white">Dashboard</a></li>

        </ul>
      </div>
      <div class="col-12 col-md-9 col-lg-10 p-4">
        <h1>Exercise 14.2 - Responsive Sidebar</h1>
        <p>Sidebar shows only on tablets (md) and above using d-none d-md-block. Hidden on mobile.</p>
