<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 7.2 - Text Transform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1>Exercise 7.2 - Text Transform Utilities</h1>
    <p class="text-uppercase">This text is uppercased.</p>
    <p class="text-lowercase">THIS TEXT IS LOWERCASED.</p>
    <p class="text-capitalize">this text is capitalized automatically.</p>
    <hr>
    <p>Original: bootstrap 5 exercises</p>
    <p class="text-uppercase fw-bold">Uppercase: BOOTSTRAP 5 EXERCISES</p>
    <p class="text-lowercase">Lowercase: bootstrap 5 exercises</p>
    <p class="text-capitalize">Capitalize: Bootstrap 5 Exercises</p>
  </div>
</body>
</html>
