<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 11.1 - Profile Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Exercise 11.1 - Profile Card</h1>
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card">
          <img src="https://via.placeholder.com/400x300" class="card-img-top" alt="Profile">
          <div class="card-body text-center">
            <h5 class="card-title">John Doe</h5>
            <p class="card-text text-muted">Full Stack Developer</p>
            <p class="card-text">Passionate about building scalable web applications with modern technologies.</p>
            <div class="d-flex justify-content-center gap-2">
              <button class="btn btn-primary">Follow</button>
              <button class="btn btn-outline-secondary">Message</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
