<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 9.2 - Button Groups & Toggle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">Exercise 9.2 - Button Groups & Toggle</h1>
    <h5>Button Group</h5>
    <div class="btn-group mb-3" role="group">
      <button class="btn btn-primary">Left</button>
      <button class="btn btn-primary">Middle</button>
      <button class="btn btn-primary">Right</button>
    </div>
    <h5>Button Toolbar</h5>
    <div class="btn-toolbar mb-3">
      <div class="btn-group me-2">
        <button class="btn btn-outline-secondary">1</button>
        <button class="btn btn-outline-secondary">2</button>
        <button class="btn btn-outline-secondary">3</button>
      </div>
      <div class="btn-group me-2">
        <button class="btn btn-outline-secondary">4</button>
        <button class="btn btn-outline-secondary">5</button>
      </div>
    </div>
    <h5>Checkbox Toggle Buttons</h5>
    <div class="btn-group" role="group">
      <input type="checkbox" class="btn-check" id="check1" autocomplete="off">
      <label class="btn btn-outline-primary" for="check1">Option 1</label>
      <input type="checkbox" class="btn-check" id="check2" autocomplete="off">
      <label class="btn btn-outline-primary" for="check2">Option 2</label>
      <input type="checkbox" class="btn-check" id="check3" autocomplete="off">
      <label class="btn btn-outline-primary" for="check3">Option 3</label>
    </div>
  </div>
</body>
</html>
