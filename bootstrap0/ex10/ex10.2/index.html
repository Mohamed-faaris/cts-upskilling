<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 10.2 - Tabbed Navigation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">Exercise 10.2 - Tabs & Pills</h1>
    <h5>nav-tabs</h5>
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><a href="#" class="nav-link active">Home</a></li>
      <li class="nav-item"><a href="#" class="nav-link">Profile</a></li>
      <li class="nav-item"><a href="#" class="nav-link">Messages</a></li>
    </ul>
    <h5>nav-pills</h5>
    <ul class="nav nav-pills mb-3">
      <li class="nav-item"><a href="#" class="nav-link active">Home</a></li>
      <li class="nav-item"><a href="#" class="nav-link">Profile</a></li>
      <li class="nav-item"><a href="#" class="nav-link">Messages</a></li>
    </ul>
    <h5>Pills with Tab Content</h5>
    <ul class="nav nav-pills mb-3" id="pillsTab">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab1">Tab 1</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab2">Tab 2</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab3">Tab 3</button></li>
    </ul>
    <div class="tab-content">
      <div class="tab-pane fade show active" id="tab1">Content for Tab 1</div>
      <div class="tab-pane fade" id="tab2">Content for Tab 2</div>
      <div class="tab-pane fade" id="tab3">Content for Tab 3</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
