<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 15.1 - Border Utilities</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">Exercise 15.1 - Borders & Rounded Corners</h1>
    <div class="row">
      <div class="col-md-4 text-center mb-4">
        <img src="https://via.placeholder.com/150" class="border border-primary border-3 rounded-circle" alt="Rounded circle image">
        <p class="mt-2">border border-primary border-3 rounded-circle</p>
      </div>
      <div class="col-md-4 text-center mb-4">
        <div class="border border-success border-4 rounded p-4">
          <h5>Success Border</h5>
          <p>border border-success border-4 rounded</p>
        </div>
      </div>
      <div class="col-md-4 text-center mb-4">
        <div class="border-start border-danger border-5 p-4">
          <h5>Left Border</h5>
          <p>border-start border-danger border-5</p>
        </div>
      </div>
    </div>
    <div class="d-flex gap-3 flex-wrap">
      <div class="border rounded-0 p-3">rounded-0</div>
      <div class="border rounded-1 p-3">rounded-1</div>
      <div class="border rounded-2 p-3">rounded-2</div>
      <div class="border rounded-3 p-3">rounded-3</div>
      <div class="border rounded-pill px-4 py-2">rounded-pill</div>
    </div>
  </div>
</body>
</html>
