<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 15.2 - Shadows & Rounded</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-5">Exercise 15.2 - Shadows & Rounded Pill</h1>
    <div class="row justify-content-center g-4">
      <div class="col-md-4">
        <div class="card shadow-sm rounded-pill text-center p-4">
          <h5>shadow-sm</h5>
          <p class="mb-0">Small shadow with rounded-pill</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow rounded-pill text-center p-4">
          <h5>shadow</h5>
          <p class="mb-0">Regular shadow with rounded-pill</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-lg rounded-pill text-center p-4">
          <h5>shadow-lg</h5>
          <p class="mb-0">Large shadow with rounded-pill</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
