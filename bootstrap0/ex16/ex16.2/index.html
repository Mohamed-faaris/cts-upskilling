<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 16.2 - Badge Overlay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">Exercise 16.2 - Badge Overlay on Image</h1>
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="position-relative d-inline-block">
          <img src="https://via.placeholder.com/400x300" class="img-fluid rounded" alt="Sample Image">
          <span class="position-absolute top-0 start-0 badge bg-danger m-2">NEW</span>
          <span class="position-absolute top-0 end-0 badge bg-primary m-2">FEATURED</span>
          <span class="position-absolute bottom-0 start-0 badge bg-success m-2">50% OFF</span>
          <span class="position-absolute bottom-0 end-0 badge bg-warning text-dark m-2">LIMITED</span>
        </div>
        <p class="mt-3 text-center">Badges are overlaid using position-relative on the container and position-absolute on badges.</p>
      </div>
    </div>
  </div>
</body>
</html>
