<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4.1 - Two-Column Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">Exercise 4.1 - Sidebar + Content</h1>
    <div class="row">
      <div class="col-md-3 mb-3">
        <div class="bg-dark text-white p-4 rounded">
          <h4>Sidebar</h4>
          <ul class="nav flex-column">
            <li class="nav-item"><a href="#" class="nav-link text-white">Link 1</a></li>
            <li class="nav-item"><a href="#" class="nav-link text-white">Link 2</a></li>
            <li class="nav-item"><a href="#" class="nav-link text-white">Link 3</a></li>
          </ul>
        </div>
      </div>
      <div class="col-md-9 mb-3">
        <div class="bg-light p-4 rounded">
          <h4>Content Area</h4>
          <p>col-md-9. This is the main content area. The sidebar takes 3 columns on medium screens and above, while this content area takes 9 columns.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
