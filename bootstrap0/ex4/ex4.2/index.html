<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4.2 - Four-Column Equal Width</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Exercise 4.2 - Four Equal Columns</h1>
    <div class="row">
      <div class="col-sm-3 mb-3"><div class="bg-primary text-white p-4 text-center rounded">col-sm-3</div></div>
      <div class="col-sm-3 mb-3"><div class="bg-secondary text-white p-4 text-center rounded">col-sm-3</div></div>
      <div class="col-sm-3 mb-3"><div class="bg-success text-white p-4 text-center rounded">col-sm-3</div></div>
      <div class="col-sm-3 mb-3"><div class="bg-info text-white p-4 text-center rounded">col-sm-3</div></div>
    </div>
  </div>
</body>
</html>
