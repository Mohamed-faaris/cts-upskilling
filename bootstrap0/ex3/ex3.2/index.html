<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3.2 - Container, Row, Col</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Exercise 3.2 - Container, Row, Col Classes</h1>
    <div class="row">
      <div class="col-sm-4 mb-3"><div class="bg-info text-white p-4 text-center rounded">col-sm-4</div></div>
      <div class="col-sm-4 mb-3"><div class="bg-warning text-white p-4 text-center rounded">col-sm-4</div></div>
      <div class="col-sm-4 mb-3"><div class="bg-danger text-white p-4 text-center rounded">col-sm-4</div></div>
    </div>
    <div class="row mt-3">
      <div class="col-6 mb-3"><div class="bg-dark text-white p-4 text-center rounded">col-6</div></div>
      <div class="col-6 mb-3"><div class="bg-secondary text-white p-4 text-center rounded">col-6</div></div>
    </div>
  </div>
</body>
</html>
