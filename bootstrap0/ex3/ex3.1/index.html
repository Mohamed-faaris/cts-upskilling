<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3.1 - Responsive Grid Stack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Exercise 3.1 - Responsive Columns</h1>
    <p class="text-center">Stack on mobile, 2 on tablet, 3 on desktop</p>
    <div class="row">
      <div class="col-12 col-md-6 col-lg-4 mb-3">
        <div class="bg-primary text-white p-4 text-center rounded">Column 1</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4 mb-3">
        <div class="bg-secondary text-white p-4 text-center rounded">Column 2</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4 mb-3">
        <div class="bg-success text-white p-4 text-center rounded">Column 3</div>
      </div>
    </div>
  </div>
</body>
</html>
