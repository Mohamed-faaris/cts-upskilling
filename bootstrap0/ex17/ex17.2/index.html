<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 17.2 - Icon-Only Buttons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">Exercise 17.2 - Icon-Only Buttons</h1>
    <p class="lead">Text replaced with Bootstrap Icons for cleaner UI.</p>
    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-primary"><i class="bi bi-plus-circle"></i> Add</button>
      <button class="btn btn-secondary"><i class="bi bi-pencil"></i> Edit</button>
      <button class="btn btn-danger"><i class="bi bi-trash"></i> Delete</button>
      <button class="btn btn-info"><i class="bi bi-search"></i> Search</button>
      <button class="btn btn-success"><i class="bi bi-download"></i> Download</button>
      <button class="btn btn-warning"><i class="bi bi-gear"></i> Settings</button>
    </div>
    <h5 class="mt-4">Icon-Only (no text)</h5>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-primary" aria-label="Add"><i class="bi bi-plus-circle fs-5"></i></button>
      <button class="btn btn-outline-secondary" aria-label="Edit"><i class="bi bi-pencil fs-5"></i></button>
      <button class="btn btn-outline-danger" aria-label="Delete"><i class="bi bi-trash fs-5"></i></button>
      <button class="btn btn-outline-info" aria-label="Search"><i class="bi bi-search fs-5"></i></button>
      <button class="btn btn-outline-success" aria-label="Download"><i class="bi bi-download fs-5"></i></button>
    </div>
  </div>
</body>
</html>
