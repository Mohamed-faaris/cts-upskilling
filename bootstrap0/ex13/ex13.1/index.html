<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 13.1 - Dashboard Colors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid mt-3">
    <h1 class="mb-4">Exercise 13.1 - Dashboard with Contextual Colors</h1>
    <div class="row g-3">
      <div class="col-md-3">
        <div class="bg-primary text-white p-4 rounded shadow-sm">
          <h5>Users</h5>
          <h2>1,245</h2>
          <small>+12% increase</small>
        </div>
      </div>
      <div class="col-md-3">
        <div class="bg-success text-white p-4 rounded shadow-sm">
          <h5>Revenue</h5>
          <h2>$45,678</h2>
          <small>+8.5% increase</small>
        </div>
      </div>
      <div class="col-md-3">
        <div class="bg-warning text-dark p-4 rounded shadow-sm">
          <h5>Orders</h5>
          <h2>567</h2>
          <small>+3.2% increase</small>
        </div>
      </div>
      <div class="col-md-3">
        <div class="bg-danger text-white p-4 rounded shadow-sm">
          <h5>Alerts</h5>
          <h2>23</h2>
          <small>+5 critical</small>
        </div>
      </div>
    </div>
    <div class="row mt-4">
      <div class="col-md-6">
        <div class="bg-info text-white p-4 rounded shadow-sm">
          <h5 class="text-dark">Info Panel</h5>
          <p class="text-dark">bg-info with dark text for contrast.</p>
        </div>
      </div>
      <div class="col-md-6">
        <div class="bg-dark text-white p-4 rounded shadow-sm">
          <h5>Dark Panel</h5>
          <p class="text-muted">bg-dark with white and muted text.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
