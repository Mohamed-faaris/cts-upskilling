<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 13.2 - Gradient Background</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid">
    <div class="bg-dark bg-gradient text-white p-5 text-center">
      <h1 class="display-3">Exercise 13.2</h1>
      <p class="lead">bg-gradient with bg-dark and white text</p>
      <button class="btn btn-light btn-lg mt-3">Learn More</button>
    </div>
    <div class="row g-0 mt-4">
      <div class="col-md-4">
        <div class="bg-primary bg-gradient text-white p-5 text-center">
          <h4>Primary Gradient</h4>
          <p>bg-primary bg-gradient</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="bg-success bg-gradient text-white p-5 text-center">
          <h4>Success Gradient</h4>
          <p>bg-success bg-gradient</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="bg-warning bg-gradient text-dark p-5 text-center">
          <h4>Warning Gradient</h4>
          <p>bg-warning bg-gradient</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
