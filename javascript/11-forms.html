<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms - Event Registration</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 20px auto; padding: 0 16px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .error { color: #dc2626; font-size: 0.85rem; margin-top: 4px; display: none; }
        button { padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; }
        button:hover { background: #3730a3; }
        .success { padding: 12px; background: #d1fae5; border: 1px solid #22c55e; border-radius: 6px; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <h2>Event Registration</h2>
    <form id="regForm">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" required>
            <div class="error" id="nameError">Please enter your name</div>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
            <div class="error" id="emailError">Please enter a valid email</div>
        </div>
        <div class="form-group">
            <label for="eventSelect">Event</label>
            <select id="eventSelect">
                <option value="">Select an event</option>
                <option value="Music Fest">Music Fest</option>
                <option value="Art Workshop">Art Workshop</option>
                <option value="Jazz Night">Jazz Night</option>
            </select>
            <div class="error" id="eventError">Please select an event</div>
        </div>
        <button type="submit">Register</button>
    </form>
    <div class="success" id="successMsg">Registration successful!</div>

    <script>
        /*
        11. Working with Forms
        Scenario: Create a registration form for event sign-up.
        Objective: Connect form inputs to JavaScript.
        Task:
        • Capture name, email, and selected event using form.elements
        • Prevent default form behavior using event.preventDefault()
        • Validate inputs and show errors inline
        */

        const form = document.getElementById('regForm');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const name = form.elements['name'].value.trim();
            const email = form.elements['email'].value.trim();
            const event = form.elements['eventSelect'].value;

            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            const eventError = document.getElementById('eventError');

            nameError.style.display = 'none';
            emailError.style.display = 'none';
            eventError.style.display = 'none';

            let valid = true;

            if (!name) {
                nameError.style.display = 'block';
                valid = false;
            }
            if (!email || !email.includes('@')) {
                emailError.style.display = 'block';
                valid = false;
            }
            if (!event) {
                eventError.style.display = 'block';
                valid = false;
            }

            if (valid) {
                document.getElementById('successMsg').style.display = 'block';
                console.log('Registration:', { name, email, event });
                setTimeout(() => {
                    document.getElementById('successMsg').style.display = 'none';
                    form.reset();
                }, 3000);
            }
        });
    </script>
</body>
</html>
