<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern JS - ES6+ Features</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 16px; }
        pre { background: #f5f5f5; padding: 12px; border-radius: 6px; overflow-x: auto; }
    </style>
</head>
<body>
    <h2>Modern JavaScript Features</h2>
    <div id="output"></div>

    <script>
        /*
        10. Modern JavaScript Features
        Scenario: Refactor code to be concise and maintainable.
        Objective: Use ES6+ features.
        Task:
        • Use let, const, default parameters in functions
        • Use destructuring to extract event details
        • Use spread operator to clone event list before filtering
        */

        // let, const, default parameters
        function createEvent(name, seats = 10) {
            return { name, seats };
        }

        const event1 = createEvent("Summer Music Fest", 50);
        const event2 = createEvent("Art Workshop");
        const events = [event1, event2];

        // Spread operator to clone before filtering
        const allEvents = [...events];
        const filtered = allEvents.filter(e => e.seats > 20);

        // Destructuring to extract event details
        function displayEvent({ name, seats }) {
            return `${name} has ${seats} seat(s)`;
        }

        const output = document.getElementById('output');
        output.innerHTML = `
            <h3>Events</h3>
            <pre>${events.map(displayEvent).join('\n')}</pre>
            <h3>Filtered (seats > 20)</h3>
            <pre>${filtered.map(displayEvent).join('\n')}</pre>
            <h3>Spread clone test (original unchanged)</h3>
            <pre>Original length: ${events.length}, Filtered length: ${filtered.length}</pre>
        `;

        console.log('Original:', events);
        console.log('Filtered:', filtered);
    </script>
</body>
</html>
