<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debugging - Registration Fix</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 20px auto; padding: 0 16px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #3730a3; }
        #debug-output { margin-top: 16px; padding: 12px; background: #1e293b; color: #22c55e; border-radius: 6px; font-family: monospace; font-size: 0.85rem; min-height: 60px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Debug Registration</h2>
    <form id="regForm">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" value="John">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" value="john@test.com">
        </div>
        <button type="submit">Register</button>
    </form>
    <div id="debug-output">// Console output will appear here</div>

    <script>
        /*
        13. Debugging and Testing
        Scenario: Registration is failing silently. You need to debug.
        Objective: Use browser tools to inspect and fix issues.
        Task:
        • Use Chrome Dev Tools Console and Network tab
        • Add breakpoints and inspect variables
        • Log form submission steps and check fetch request payload
        */

        const form = document.getElementById('regForm');
        const debugOutput = document.getElementById('debug-output');

        function debugLog(...args) {
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
            debugOutput.textContent += '\n' + msg;
            console.log(...args);
        }

        function validateForm(data) {
            debugLog('Validating:', data);
            if (!data.name || data.name.length < 2) {
                debugLog('Validation failed: name too short');
                return false;
            }
            if (!data.email || !data.email.includes('@')) {
                debugLog('Validation failed: invalid email');
                return false;
            }
            debugLog('Validation passed');
            return true;
        }

        async function submitForm(data) {
            debugLog('Submitting payload:', data);
            // Simulate fetch - set breakpoint here to inspect
            const response = await new Promise((resolve, reject) => {
                setTimeout(() => {
                    debugLog('Server responded with success');
                    resolve({ id: 123, status: 'ok' });
                }, 500);
            });
            return response;
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = {
                name: form.elements['name'].value.trim(),
                email: form.elements['email'].value.trim()
            };

            debugLog('Form submitted', formData);

            if (!validateForm(formData)) {
                debugLog('Submission blocked due to validation errors');
                return;
            }

            try {
                const result = await submitForm(formData);
                debugLog('Final result:', result);
                alert('Registration successful! ID: ' + result.id);
            } catch (err) {
                debugLog('ERROR:', err.message);
                alert('Registration failed!');
            }
        });

        debugLog('Page loaded. Open DevTools Console to debug.');
    </script>
</body>
</html>
