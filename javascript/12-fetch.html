<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API - Server Submission</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 20px auto; padding: 0 16px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #3730a3; }
        #status { padding: 12px; border-radius: 6px; margin-top: 12px; display: none; }
        .success { background: #d1fae5; border: 1px solid #22c55e; color: #166534; }
        .error { background: #fee2e2; border: 1px solid #ef4444; color: #991b1b; }
    </style>
</head>
<body>
    <h2>Submit Registration</h2>
    <form id="regForm">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
        </div>
        <button type="submit">Submit</button>
    </form>
    <div id="status"></div>

    <script>
        /*
        12. AJAX & Fetch API
        Scenario: Send user registration to the server.
        Objective: Simulate backend communication.
        Task:
        • Use fetch() to POST user data to a mock API
        • Show success/failure message after submission
        • Use setTimeout() to simulate a delayed response
        */

        const form = document.getElementById('regForm');
        const status = document.getElementById('status');

        // Mock API endpoint (JSONPlaceholder for demo)
        const API_URL = 'https://jsonplaceholder.typicode.com/posts';

        async function submitRegistration(data) {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!response.ok) throw new Error('Server error');
            return response.json();
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const data = {
                name: form.elements['name'].value.trim(),
                email: form.elements['email'].value.trim()
            };

            status.style.display = 'block';
            status.textContent = 'Submitting...';
            status.className = '';

            // Simulate delayed response
            setTimeout(async () => {
                try {
                    const result = await submitRegistration(data);
                    status.textContent = `✅ Success! Registration ID: ${result.id}`;
                    status.className = 'success';
                    form.reset();
                } catch (err) {
                    status.textContent = `❌ Failed: ${err.message}`;
                    status.className = 'error';
                }
            }, 1500);
        });
    </script>
</body>
</html>
