<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Layout - Exercise 4.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Two-Column Layout</h1>
        <div class="row">
            <div class="col-md-3 mb-3">
                <div class="p-4 bg-dark text-white rounded">
                    <h5>Sidebar</h5>
                    <ul class="nav flex-column">
                        <li class="nav-item"><a href="#" class="nav-link text-white">Dashboard</a></li>
                        <li class="nav-item"><a href="#" class="nav-link text-white">Events</a></li>
                        <li class="nav-item"><a href="#" class="nav-link text-white">Settings</a></li>
                    </ul>
                </div>
            </div>
            <div class="col-md-9">
                <div class="p-4 bg-light rounded">
                    <h3>Main Content Area</h3>
                    <p>This is the main content section spanning 9 columns on medium screens and above.</p>
                    <div class="alert alert-primary">Sidebar is 3 columns, content is 9 columns.</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
