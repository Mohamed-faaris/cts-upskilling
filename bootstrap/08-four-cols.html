<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Columns - Exercise 4.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Four Equal Columns</h1>
        <p class="lead">Using <code>col-sm-3</code> for equal width on small+ screens.</p>
        <div class="row">
            <div class="col-sm-3 mb-3">
                <div class="p-4 bg-primary text-white rounded text-center">Column 1</div>
            </div>
            <div class="col-sm-3 mb-3">
                <div class="p-4 bg-secondary text-white rounded text-center">Column 2</div>
            </div>
            <div class="col-sm-3 mb-3">
                <div class="p-4 bg-success text-white rounded text-center">Column 3</div>
            </div>
            <div class="col-sm-3 mb-3">
                <div class="p-4 bg-info text-white rounded text-center">Column 4</div>
            </div>
        </div>
    </div>
</body>
</html>
