<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid System - Exercise 3.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Bootstrap Grid System</h1>
        <p class="lead">Using <code>.container</code> → <code>.row</code> → <code>.col-*</code>.</p>
        <div class="row mb-3">
            <div class="col-4"><div class="p-3 bg-info text-white rounded text-center">col-4</div></div>
            <div class="col-4"><div class="p-3 bg-info text-white rounded text-center">col-4</div></div>
            <div class="col-4"><div class="p-3 bg-info text-white rounded text-center">col-4</div></div>
        </div>
        <div class="row mb-3">
            <div class="col-6"><div class="p-3 bg-warning rounded text-center">col-6</div></div>
            <div class="col-6"><div class="p-3 bg-warning rounded text-center">col-6</div></div>
        </div>
        <div class="row">
            <div class="col-8"><div class="p-3 bg-danger text-white rounded text-center">col-8</div></div>
            <div class="col-4"><div class="p-3 bg-danger text-white rounded text-center">col-4</div></div>
        </div>
    </div>
</body>
</html>
