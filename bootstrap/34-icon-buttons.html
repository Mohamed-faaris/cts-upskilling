<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Buttons - Exercise 17.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Icon-Only Buttons</h1>
        <p class="lead">Text replaced with Bootstrap Icons for cleaner UI.</p>
        <div class="d-flex gap-2 flex-wrap">
            <button class="btn btn-primary"><i class="bi bi-plus-lg"></i></button>
            <button class="btn btn-success"><i class="bi bi-check-lg"></i></button>
            <button class="btn btn-danger"><i class="bi bi-trash"></i></button>
            <button class="btn btn-warning"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-info"><i class="bi bi-search"></i></button>
            <button class="btn btn-dark"><i class="bi bi-gear"></i></button>
            <button class="btn btn-outline-primary"><i class="bi bi-download"></i></button>
        </div>
        <hr>
        <h5>Icon + Text Buttons</h5>
        <div class="d-flex gap-2">
            <button class="btn btn-primary"><i class="bi bi-person-plus me-1"></i> Add User</button>
            <button class="btn btn-success"><i class="bi bi-check-circle me-1"></i> Save</button>
            <button class="btn btn-danger"><i class="bi bi-x-circle me-1"></i> Cancel</button>
        </div>
    </div>
</body>
</html>
