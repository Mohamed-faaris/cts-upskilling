<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Exercise 13.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Dashboard</h1>
        <div class="row g-3">
            <div class="col-md-3">
                <div class="p-4 bg-primary text-white rounded">
                    <h6>Total Events</h6>
                    <h2 class="mb-0">24</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="p-4 bg-success text-white rounded">
                    <h6>Registrations</h6>
                    <h2 class="mb-0">1,342</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="p-4 bg-warning rounded">
                    <h6>Pending</h6>
                    <h2 class="mb-0">18</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="p-4 bg-danger text-white rounded">
                    <h6>Cancelled</h6>
                    <h2 class="mb-0">5</h2>
                </div>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-12">
                <div class="p-4 bg-dark text-white rounded">
                    <h5 class="text-warning">Recent Activity</h5>
                    <p class="text-muted mb-0">5 new registrations today • 2 events created • 1 cancellation</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
