<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Visibility - Exercise 14.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Display & Visibility</h1>
        <p class="lead">Sections hide/show based on screen size using <code>d-*</code> classes.</p>
        <div class="d-none d-md-block p-4 bg-primary text-white rounded mb-3">
            ✅ Visible on medium+ screens (<code>d-none d-md-block</code>)
        </div>
        <div class="d-none d-lg-flex p-4 bg-success text-white rounded mb-3">
            ✅ Visible as flex on large+ screens (<code>d-none d-lg-flex</code>)
        </div>
        <div class="p-4 bg-warning rounded mb-3">
            ⚠️ Always visible
        </div>
        <div class="d-md-none p-4 bg-info text-white rounded">
            📱 Visible only on mobile (<code>d-md-none</code>)
        </div>
    </div>
</body>
</html>
