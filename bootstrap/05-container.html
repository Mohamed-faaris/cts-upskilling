<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Container - Exercise 3.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Responsive Columns</h1>
        <p class="lead">Stack on mobile, 2 per row on tablet, 3 per row on desktop.</p>
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4 mb-3">
                <div class="p-4 bg-primary text-white rounded text-center">Column 1</div>
            </div>
            <div class="col-12 col-md-6 col-lg-4 mb-3">
                <div class="p-4 bg-secondary text-white rounded text-center">Column 2</div>
            </div>
            <div class="col-12 col-md-6 col-lg-4 mb-3">
                <div class="p-4 bg-success text-white rounded text-center">Column 3</div>
            </div>
        </div>
    </div>
</body>
</html>
