<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transform - Exercise 7.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Text Transform Utilities</h1>
        <p class="text-uppercase">This text is uppercase.</p>
        <p class="text-lowercase">THIS TEXT IS LOWERCASE.</p>
        <p class="text-capitalize">this text is capitalized.</p>
        <hr>
        <div class="card p-4">
            <p><strong>Original:</strong> bootstrap is awesome</p>
            <p><strong>text-uppercase:</strong> <span class="text-uppercase">bootstrap is awesome</span></p>
            <p><strong>text-lowercase:</strong> <span class="text-lowercase">BOOTSTRAP IS AWESOME</span></p>
            <p><strong>text-capitalize:</strong> <span class="text-capitalize">bootstrap is awesome</span></p>
        </div>
    </div>
</body>
</html>
