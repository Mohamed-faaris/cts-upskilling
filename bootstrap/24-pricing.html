<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Section - Exercise 12.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-5">Pricing Plans</h1>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card text-center p-4">
                    <h5 class="text-muted text-uppercase">Basic</h5>
                    <h2 class="display-4 fw-bold">$9</h2>
                    <p class="text-muted">per month</p>
                    <ul class="list-unstyled mb-4">
                        <li class="py-2">5 Events</li>
                        <li class="py-2">Basic Support</li>
                        <li class="py-2">Email Notifications</li>
                    </ul>
                    <button class="btn btn-outline-primary">Get Started</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center p-4 border-primary">
                    <div class="badge bg-primary w-25 mx-auto mb-2">Popular</div>
                    <h5 class="text-muted text-uppercase">Pro</h5>
                    <h2 class="display-4 fw-bold">$29</h2>
                    <p class="text-muted">per month</p>
                    <ul class="list-unstyled mb-4">
                        <li class="py-2">50 Events</li>
                        <li class="py-2">Priority Support</li>
                        <li class="py-2">SMS Notifications</li>
                    </ul>
                    <button class="btn btn-primary">Get Started</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center p-4">
                    <h5 class="text-muted text-uppercase">Enterprise</h5>
                    <h2 class="display-4 fw-bold">$99</h2>
                    <p class="text-muted">per month</p>
                    <ul class="list-unstyled mb-4">
                        <li class="py-2">Unlimited Events</li>
                        <li class="py-2">24/7 Support</li>
                        <li class="py-2">Custom Integrations</li>
                    </ul>
                    <button class="btn btn-outline-primary">Contact Us</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
