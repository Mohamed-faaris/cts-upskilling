<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Object - Exercise 11.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Media Object Layout</h1>
        <div class="d-flex align-items-start gap-3 p-3 mb-3 border rounded">
            <img src="https://via.placeholder.com/80/4f46e5/ffffff?text=EV" class="rounded" alt="Event">
            <div>
                <h5 class="mt-0">Summer Music Fest</h5>
                <p class="mb-1">Join us for a weekend of live performances, food stalls, and community fun at Central Park.</p>
                <small class="text-muted">July 15, 2024 | 50 seats remaining</small>
            </div>
        </div>
        <div class="d-flex align-items-start gap-3 p-3 border rounded">
            <img src="https://via.placeholder.com/80/0ea5e9/ffffff?text=AR" class="rounded" alt="Art">
            <div>
                <h5 class="mt-0">Art Workshop</h5>
                <p class="mb-1">Learn watercolor techniques from local artists. All materials provided.</p>
                <small class="text-muted">August 1, 2024 | 30 seats remaining</small>
            </div>
        </div>
    </div>
</body>
</html>
