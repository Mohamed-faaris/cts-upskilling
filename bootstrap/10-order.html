<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Column Order - Exercise 5.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Column Reordering</h1>
        <p class="lead">On mobile: Sidebar first, Content second. On tablet+: Content first, Sidebar second.</p>
        <div class="row">
            <div class="col-md-8 order-md-2 mb-3">
                <div class="p-4 bg-light border rounded">
                    <h3>Main Content</h3>
                    <p>This appears on the right on desktop (<code>order-md-2</code>).</p>
                </div>
            </div>
            <div class="col-md-4 order-md-1 mb-3">
                <div class="p-4 bg-dark text-white rounded">
                    <h5>Sidebar</h5>
                    <p>This appears on the left on desktop (<code>order-md-1</code>).</p>
                </div>
            </div>
        </div>
        <div class="alert alert-info">Resize the browser to see the order change.</div>
    </div>
</body>
</html>
