<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Badge - Exercise 16.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Image Overlay</h1>
        <p class="lead">Badge overlaid on an image using <code>position-relative</code> + <code>position-absolute</code>.</p>
        <div class="position-relative d-inline-block">
            <img src="https://via.placeholder.com/400x250/4f46e5/ffffff?text=Event+Banner" class="rounded" alt="Banner">
            <span class="position-absolute top-0 end-0 badge bg-danger m-2">LIVE</span>
            <span class="position-absolute bottom-0 start-0 badge bg-dark m-2">July 15, 2024</span>
        </div>
        <div class="mt-4 p-4 bg-light rounded position-relative">
            <h5>Card with overlay</h5>
            <p>This card has a "New" badge in the top-right corner.</p>
            <span class="position-absolute top-0 end-0 badge bg-primary m-2">New</span>
        </div>
    </div>
</body>
</html>
