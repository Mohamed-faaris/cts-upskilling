<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center Content - Exercise 5.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Centering with Flexbox</h1>
        <p class="lead">Using <code>justify-content-center</code> and <code>align-items-center</code>.</p>
        <div class="row justify-content-center align-items-center" style="min-height: 300px; background: #f8f9fa; border-radius: 8px;">
            <div class="col-4 text-center">
                <div class="p-5 bg-primary text-white rounded">
                    <h3>Centered!</h3>
                    <p class="mb-0">Both horizontally & vertically</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
