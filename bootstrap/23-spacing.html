<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacing Utilities - Exercise 12.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Spacing Utilities</h1>
        <p class="lead">Margin and padding classes demo.</p>

        <div class="bg-light p-5 rounded">
            <h5>Parent has <code>p-5</code></h5>
            <div class="bg-primary text-white m-3 p-2 rounded">
                <code>m-3 p-2</code> — margin outside, padding inside
            </div>
            <div class="bg-success text-white mt-4 py-5 px-3 rounded">
                <code>mt-4 py-5 px-3</code> — top margin, vertical padding, horizontal padding
            </div>
            <div class="bg-info text-white mb-0 pt-3 pb-3 rounded">
                <code>mb-0 pt-3 pb-3</code> — no bottom margin, top & bottom padding
            </div>
        </div>
    </div>
</body>
</html>
