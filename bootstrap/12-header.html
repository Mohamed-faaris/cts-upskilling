<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Header - Exercise 7.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Card with Flex Header</h1>
        <p class="lead">Using <code>justify-content-between</code> and <code>align-items-center</code>.</p>
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span class="fw-bold">Event Title</span>
                <span class="badge bg-primary">New</span>
            </div>
            <div class="card-body">
                <p class="card-text">This card header uses flexbox to space the title and badge.</p>
                <button class="btn btn-outline-primary">View Details</button>
            </div>
        </div>
    </div>
</body>
</html>
