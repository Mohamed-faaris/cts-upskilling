<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap JS Plugins - Exercise 2.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Bootstrap JavaScript Plugins</h1>
        <p class="lead">This page includes <code>bootstrap.bundle.min.js</code> for interactive components.</p>

        <button class="btn btn-primary mt-3" data-bs-toggle="tooltip" title="I'm a tooltip!">Hover me</button>

        <div class="alert alert-success mt-4">
            ✅ <code>bootstrap.bundle.min.js</code> includes Popper.js for tooltips, popovers, and dropdowns.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));
        });
    </script>
</body>
</html>
