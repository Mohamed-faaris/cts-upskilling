<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders - Exercise 15.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Border Utilities</h1>
        <div class="row text-center g-4">
            <div class="col-md-4">
                <img src="https://via.placeholder.com/150/4f46e5/ffffff?text=Img" class="border border-primary border-3 rounded-circle p-1" alt="Circle">
                <p class="mt-2"><code>border border-primary border-3 rounded-circle</code></p>
            </div>
            <div class="col-md-4">
                <img src="https://via.placeholder.com/150/0ea5e9/ffffff?text=Img" class="border border-success border-4 rounded" alt="Rounded">
                <p class="mt-2"><code>border border-success border-4 rounded</code></p>
            </div>
            <div class="col-md-4">
                <img src="https://via.placeholder.com/150/f59e0b/ffffff?text=Img" class="border border-warning border-2 rounded-pill p-2" alt="Pill">
                <p class="mt-2"><code>border border-warning border-2 rounded-pill</code></p>
            </div>
        </div>
        <div class="mt-4 p-4 border-top border-primary border-3">
            <code>border-top border-primary border-3</code> — top border only
        </div>
    </div>
</body>
</html>
