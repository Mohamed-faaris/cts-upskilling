<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography - Exercise 7.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Bootstrap Typography</h1>
        <p class="display-1">display-1</p>
        <p class="display-4">display-4</p>
        <p class="display-6">display-6</p>
        <p class="lead">This is a lead paragraph for emphasis.</p>
        <p class="text-muted">This is muted text.</p>
        <p class="fw-bold">Bold text using fw-bold</p>
        <p class="fw-light">Light text using fw-light</p>
        <p class="fst-italic">Italic text using fst-italic</p>
        <p class="text-primary">Primary color text</p>
        <p class="text-success">Success color text</p>
        <p class="text-danger">Danger color text</p>
        <p><small>Small text using &lt;small&gt;</small></p>
        <p><mark>Highlighted text</mark></p>
    </div>
</body>
</html>
