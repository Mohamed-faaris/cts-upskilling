<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card - Exercise 11.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card">
                    <img src="https://via.placeholder.com/300x200/4f46e5/ffffff?text=Profile" class="card-img-top" alt="Profile">
                    <div class="card-body text-center">
                        <h5 class="card-title">Jane Doe</h5>
                        <p class="card-text text-muted">Event Coordinator</p>
                        <p class="card-text">Passionate about bringing the community together through music, art, and culture.</p>
                        <a href="#" class="btn btn-primary">View Profile</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
