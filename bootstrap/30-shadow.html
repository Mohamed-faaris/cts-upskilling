<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow - Exercise 15.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Shadow & Rounded Utilities</h1>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card shadow p-4 text-center">
                    <h5>shadow</h5>
                    <p>Default shadow</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-lg p-4 text-center border-0">
                    <h5>shadow-lg</h5>
                    <p>Large shadow</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow p-4 text-center rounded-pill">
                    <h5>rounded-pill</h5>
                    <p>Pill shape with shadow</p>
                </div>
            </div>
        </div>
        <div class="mt-4 p-4 shadow-sm rounded-3 bg-light">
            <code>shadow-sm rounded-3</code> — small shadow with medium rounding
        </div>
    </div>
</body>
</html>
