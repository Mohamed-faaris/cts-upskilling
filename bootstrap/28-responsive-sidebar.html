<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Sidebar - Exercise 14.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="d-none d-md-block col-md-3 bg-dark text-white vh-100 p-4">
                <h5>Sidebar</h5>
                <ul class="nav flex-column">
                    <li class="nav-item"><a href="#" class="nav-link text-white">Dashboard</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-white">Events</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-white">Users</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-white">Settings</a></li>
                </ul>
            </div>
            <div class="col-12 col-md-9 p-4">
                <h1>Main Content</h1>
                <p>The sidebar is hidden on mobile and shows on tablet+ (<code>d-none d-md-block</code>).</p>
                <p>Resize the browser to see it appear/disappear.</p>
            </div>
        </div>
    </div>
</body>
</html>
